apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: embeddings
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: ai-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /embeddings
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: embeddings
