apiVersion: v1
kind: ServiceAccount
metadata:
  name: petstore-mcp
  namespace: petstore
automountServiceAccountToken: false
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: petstore-mcp
  namespace: petstore
  labels:
    kagent.dev/discovery: "disabled"
spec:
  transportType: http
  httpTransport:
    targetPort: 3000
    path: /mcp
  deployment:
    image: petstore-mcp:0.1.0
    imagePullPolicy: IfNotPresent
    port: 3000
    cmd: python
    args: ["src/main.py", "--transport", "http", "--host", "0.0.0.0", "--port", "3000"]
    serviceAccountName: petstore-mcp
    env:
      PETSTORE_BASE_URL: http://petstore-api.petstore.svc.cluster.local:8080
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
