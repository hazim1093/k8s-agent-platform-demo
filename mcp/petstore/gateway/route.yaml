apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: petstore-mcp
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: ai-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /mcp/petstore
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: petstore-mcp
