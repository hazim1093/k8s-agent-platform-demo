apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: petstore-mcp-apikey
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: petstore-mcp
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: petstore-mcp-keys
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: petstore-mcp-tools
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: agentgateway.dev
    kind: AgentgatewayBackend
    name: petstore-mcp
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
          - 'apiKey.agent == "assistant"'
          - 'apiKey.agent == "ops" && mcp.tool.name == "get_inventory"'
