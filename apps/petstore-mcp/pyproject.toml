[project]
name = "petstore-mcp"
version = "0.1.0"
description = "petstore-mcp MCP server built with FastMCP"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.0.0",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
