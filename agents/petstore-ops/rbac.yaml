apiVersion: v1
kind: ServiceAccount
metadata:
  name: petstore-ops
  namespace: kagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: petstore-ops-readonly
  namespace: petstore
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, configmaps, events, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: petstore-ops-tools-readonly
  namespace: petstore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: petstore-ops-readonly
subjects:
  - kind: ServiceAccount
    name: petstore-ops-tools
    namespace: kagent
