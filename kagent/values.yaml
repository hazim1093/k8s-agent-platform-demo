database:
  postgres:
    urlFile: /etc/kagent-db/url
    vectorEnabled: true
    bundled:
      enabled: false

controller:
  volumes:
    - name: kagent-db
      secret:
        secretName: kagent-db
  volumeMounts:
    - name: kagent-db
      mountPath: /etc/kagent-db
      readOnly: true

providers: null

kagent-tools:
  enabled: false

grafana-mcp:
  enabled: false

k8s-agent:
  enabled: false
kgateway-agent:
  enabled: false
istio-agent:
  enabled: false
promql-agent:
  enabled: false
observability-agent:
  enabled: false
argo-rollouts-agent:
  enabled: false
helm-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-debug-agent:
  enabled: false
