apiVersion: v1
kind: Secret
metadata:
  name: pgvector-auth
  namespace: kagent
stringData:
  password: demo
---
apiVersion: v1
kind: Secret
metadata:
  name: kagent-db
  namespace: kagent
stringData:
  url: postgres://kagent:demo@pgvector.kagent.svc.cluster.local:5432/kagent?sslmode=disable
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgvector
  namespace: kagent
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector
  namespace: kagent
  labels:
    app: pgvector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgvector
  template:
    metadata:
      labels:
        app: pgvector
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg18-trixie
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: kagent
            - name: POSTGRES_USER
              value: kagent
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgvector-auth
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kagent", "-d", "kagent"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pgvector
---
apiVersion: v1
kind: Service
metadata:
  name: pgvector
  namespace: kagent
spec:
  selector:
    app: pgvector
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
